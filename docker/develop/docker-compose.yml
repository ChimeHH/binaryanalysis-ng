name: vseeker

services:                                                                                                                                     
  bang:
    build:
      context: ../../
      dockerfile: docker/develop/settings/bast.conf
      network: host
    image: "bang"
    container_name: bang
    restart: unless-stopped
    tty: true
    privileged: true    
    logging:  
      driver: "json-file"
      options:  
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONPATH: /usr/local/lib/python3.10/packages:/usr/local/lib/python3.10/other-packages 
      ENGINE_ID: 'bang.0'  
      LOG_LEVEL: 10
      BANG_VERBOSE: 0
      BANG_CONCURRENT: 1
    entrypoint: /bin/bash 
    volumes:
      - data:/data
      - appdata:/usr/local/share/appdata
      - packages:/usr/local/lib/python3.10/packages
      - bang:/usr/local/lib/python3.10/other-packages/bang
    networks:
      - network


networks:
  network:
    driver: bridge

volumes:
  data:  
    driver: local  
    driver_opts:  
      type: none  
      device: /data/vseeker
      o: bind
  appdata:  
    driver: local  
    driver_opts:  
      type: none  
      device: /share/digitaltwins-ng/appdata
      o: bind
  packages:
    driver: local
  bang:  
    driver: local  
    driver_opts:  
      type: none  
      device: /share/bang/src/bang
      o: bind
  
