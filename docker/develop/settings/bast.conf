FROM ubuntu:24.04

ADD https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb /tmp/kaitai-struct-compiler.deb

RUN sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirror.math.princeton.edu/pub/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://mirror.math.princeton.edu/pub/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources \
    && apt-get update && apt-get install -y --no-install-recommends \
    7zip binutils bzip3 build-essential cabextract ca-certificates default-jre-headless \
    e2fsprogs e2tools erofs-utils innoextract liblzo2-dev libsnappy-dev lrzip lz4 \
    ncompress openssl python3.12 python3.12-dev python3-pip python-is-python3 \
    qemu-utils rzip squashfs-tools sudo adduser unrar unshield util-linux zchunk \
    /tmp/kaitai-struct-compiler.deb \
    && rm -rf /var/lib/apt/lists/* /tmp/kaitai-struct-compiler.deb
COPY src/bang/requirements.txt /tmp/requirements.txt
RUN AHOCORASICK_BYTES=1 pip install --break-system-packages --no-cache-dir --no-binary=pyahocorasick --index-url https://pypi.org/simple -r /tmp/requirements.txt

ADD docker/develop/settings/without_pass_sudo /etc/sudoers.d/without_pass_sudo
RUN chmod 440 /etc/sudoers.d/without_pass_sudo
RUN adduser ubuntu sudo
USER ubuntu
WORKDIR /home/ubuntu
