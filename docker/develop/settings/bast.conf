FROM ubuntu:22.04

ADD https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb /tmp/kaitai-struct-compiler.deb
ADD --checksum=sha256:516489784351abe027dc8b4bcad74d12937c5668d317e27de8c5cebc4d7884dc https://github.com/kspalaiologos/bzip3/releases/download/1.4.0/bzip3-1.4.0.tar.xz /tmp/bzip3.tar.xz

RUN sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirrors.aliyun.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://mirrors.aliyun.com/ubuntu|g' /etc/apt/sources.list \
    && apt-get update && apt-get install -y --no-install-recommends \
    7zip binutils build-essential cabextract ca-certificates default-jre-headless \
    e2fsprogs e2tools erofs-utils innoextract liblzo2-dev libsnappy-dev lrzip lz4 \
    ncompress openssl python3.10 python3.10-dev python3-pip python-is-python3 \
    qemu-utils rzip squashfs-tools sudo adduser unrar unshield util-linux zchunk \
    /tmp/kaitai-struct-compiler.deb \
    && tar -xf /tmp/bzip3.tar.xz -C /tmp \
    && cd /tmp/bzip3-1.4.0 && ./configure && make -j"$(nproc)" && make install \
    && rm -rf /var/lib/apt/lists/* /tmp/kaitai-struct-compiler.deb /tmp/bzip3.tar.xz /tmp/bzip3-1.4.0
COPY src/bang/requirements.txt /tmp/requirements.txt
RUN ldconfig
RUN AHOCORASICK_BYTES=1 pip install --no-cache-dir --no-binary=pyahocorasick --index-url http://mirrors.163.com/pypi/simple/ --extra-index-url https://pypi.org/simple --trusted-host mirrors.163.com -r /tmp/requirements.txt

ADD docker/develop/settings/without_pass_sudo /etc/sudoers.d/without_pass_sudo
RUN chmod 440 /etc/sudoers.d/without_pass_sudo
RUN adduser --disabled-password --gecos '' ubuntu && adduser ubuntu sudo
USER ubuntu
WORKDIR /home/ubuntu
